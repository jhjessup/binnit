name: Build STLs

# Public repo, so GitHub-hosted standard runner minutes are free/unlimited
# — but we still keep this lean: PR-only, path-filtered, pip-cached, and
# older runs on the same PR are cancelled, since binnit may go private
# later and this should cost little either way.
on:
  pull_request:
    paths:
      - "src/**"
      - "params/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Fit and envelope checks
        run: pytest tests/ -v

      - name: Generate STLs
        run: python src/drawer_box.py

      - name: Upload STL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binnit-stls
          path: build/*.stl
          if-no-files-found: error
          retention-days: 14
